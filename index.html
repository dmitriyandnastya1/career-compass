title":"Право, государственное управление","src":"Общий рейтинг вузов, «Атамекен» совместно с МОН РК, данные 2020 г. (рейтинг не по отдельному направлению: ориентир для выбора, а не оценка юридических программ)","list":[["Университет КАЗГЮУ имени М. С. Нарикбаева","Астана"],["Университет КИМЭП","Алматы"],["Казахстанско-Британский технический университет (KBTU)","Алматы"],["Евразийский национальный университет имени Л. Н. Гумилёва","Астана"]]},"ART":{"title":"Искусство и дизайн","src":"Национальный рейтинг ведущих вузов искусства, IQAA, 2024 г.","list":[["Казахская национальная консерватория имени Курмангазы","Алматы"],["Казахская национальная академия хореографии","Астана"]]}},"local":"Если семья живёт в Павлодаре: рядом работают Торайгыров университет (инженерные, ИТ, экономические, юридические, педагогические и другие направления) и Павлодарский педагогический университет имени Әлкей Марғұлан (педагогика). Перечень программ уточняйте на сайтах вузов.","disc":"Рейтинги составлены агентствами для вуза в целом или для группы вузов, а не для конкретной профессии. Год указан рядом с каждым списком. Перед выбором проверьте на сайте вуза, есть ли нужная образовательная программа, проходной балл ЕНТ и условия гранта.","college":"Эта профессия часто осваивается в колледже (техническое и профессиональное образование), поэтому вузы не обязательны. Колледж можно выбрать по аккредитации и отзывам работодателей региона."},K={"general":["Хвалите за усилие и путь, а не только за результат: «ты долго разбирался и сам нашёл ошибку» работает лучше, чем «ты способный».","Спрашивайте, а не решайте за ребёнка: «что в этом занятии тебе нравится больше всего?» помогает ему самому понять свои интересы.","Давайте попробовать: кружок, мастер-класс, день на работе у знакомого, короткий онлайн-курс. Интерес проверяется делом, а не разговором.","Не сравнивайте с другими детьми. Сравнивайте ребёнка с ним самим месяц назад.","Профессия в 10–15 лет — не приговор. Интересы меняются, это нормально, и итог не обязан совпасть с результатом сайта."],"tips":{"math":["Играйте в числа: головоломки, судоку, логические игры, задачи на сообразительность.","Показывайте математику в жизни: бюджет поездки, скидки, рецепты, скорость и расстояние."],"cs":["Предложите безопасный первый проект: простая игра или сайт в визуальном конструкторе вроде Scratch.","Обсуждайте, как устроены приложения и интернет, и дайте ребёнку объяснить вам по-своему."],"physics":["Делайте простые опыты дома и спрашивайте «почему так получилось?».","Ходите в музеи науки и смотрите познавательные ролики, потом обсуждайте увиденное."],"chemistry":["Безопасные кухонные опыты (с взрослым): кристаллы соли, индикатор из красной капусты.","Обращайте внимание на химию вокруг: готовка, мыло, ржавчина, растения."],"biology":["Наблюдайте за природой вместе: гербарий, дневник птиц, уход за растением или питомцем.","Читайте научно-популярные книги о теле человека и животных."],"geography":["Путешествуйте по карте: выбирайте страну месяца, готовьте её блюдо, находите её на глобусе.","Играйте в «города» и «столицы», изучайте климат и ландшафты Казахстана."],"history":["Рассказывайте семейную историю и ходите в краеведческие музеи.","Смотрите исторические фильмы и после обсуждайте, где правда, а где художественный вымысел."],"languages":["Читайте вместе вслух и обсуждайте прочитанное, ведите дневник или блог.","Предложите писать истории, письма, пересказы фильмов своими словами."],"foreign":["Добавьте язык в то, что нравится: любимые игры, песни и сериалы на английском с субтитрами.","Занимайтесь понемногу, но каждый день: 10–15 минут лучше, чем два часа раз в неделю."],"economics":["Дайте ребёнку небольшой бюджет на карманные расходы и планирование покупки.","Обсуждайте, как работают деньги, налоги, права потребителя, на простых примерах."],"pe":["Найдите вид движения, который нравится ребёнку, а не тот, который нравится вам.","Двигайтесь вместе: прогулки, велосипед, лыжи, командные игры."],"art":["Дайте материалы и время без оценок: красками, глиной, карандашом можно просто экспериментировать.","Ходите на выставки и просите рассказать, что понравилось и почему."],"music":["Подберите инструмент или вокал в удобной форме, лучше с короткими занятиями.","Слушайте разную музыку и обсуждайте настроение и инструменты."],"creativity":["Давайте открытые задания без «правильного ответа»: придумать историю, изобрести предмет.","Не критикуйте идеи сразу: сначала соберите их все, потом выберите лучшие."],"logic":["Играйте в шахматы, шашки, настольные стратегии, решайте логические загадки.","Спрашивайте «а почему ты так думаешь?» и «что будет, если…?»."],"analytics":["Предлагайте сравнивать варианты по критериям: какой телефон купить, куда поехать.","Разбирайте сложное на части: большая задача делится на маленькие шаги."],"spatial":["Собирайте конструкторы, пазлы, оригами, 3D-модели.","Рисуйте схемы и планы комнаты, учитесь читать карты и чертежи."],"attention":["Играйте в «найди отличия», в игры на память и внимание, собирайте мозаику.","Помогайте разбивать работу на короткие отрезки с перерывами."],"memory":["Используйте образы, истории и ассоциации вместо зубрёжки.","Повторяйте материал через день и через неделю: так запоминание держится дольше."],"persistence":["Начинайте с коротких заданий и постепенно увеличивайте время.","Отмечайте завершённое: чек-лист и маленькое поощрение помогают доводить до конца."],"organization":["Заведите вместе недельный план и сборы портфеля накануне.","Дайте ребёнку отвечать за одно постоянное дело дома."],"responsibility":["Поручайте реальные обязанности (питомец, цветы, младший брат или сестра) и доверяйте.","Обсуждайте последствия без упрёков: «что можно сделать иначе в следующий раз?»."],"stress":["Учите замедляться: пауза, глубокий вдох, разбор «что я могу изменить прямо сейчас».","Давайте безопасный опыт выступлений и соревнований, где ошибка не страшна."],"risk":["Поощряйте новые попытки в безопасной среде: новая секция, олимпиада, проект.","Учите оценивать риск: что худшее может случиться и как я с этим справлюсь."],"communication":["Давайте больше командных занятий: кружок, лагерь, волонтёрство.","Обсуждайте разговоры: что сказал другой, что почувствовал, как ответить иначе."],"empathy":["Обсуждайте чувства героев книг и фильмов: «как ты думаешь, что он чувствовал?»","Предложите помогать: заботиться о младших, о животных, участвовать в добрых делах."],"leadership":["Давайте роль организатора: капитан команды, ведущий проекта, староста.","Обсуждайте не «приказывать», а «как договориться и распределить задачи»."],"speaking":["Тренируйтесь дома: пересказ, небольшие доклады, чтение вслух перед семьёй.","Участвуйте в школьных мероприятиях, дебатах, конкурсах чтецов."],"dexterity":["Лепка, вышивка, бисер, сборка моделей, рисование мелких деталей.","Занятия на музыкальных инструментах и каллиграфия тренируют точность движений."],"endurance":["Постепенно увеличивайте нагрузку: прогулки, плавание, бег, походы.","Следите за сном и питанием, без них выносливость не растёт."],"people":["Вовлекайте в дела, где нужно помогать: наставничество, волонтёрство, школьные дежурства.","Спросите, как ребёнок помог бы другу в трудной ситуации."],"computer":["Договоритесь о разумном времени и покажите полезные занятия за компьютером: программирование, монтаж, дизайн.","Помогите отличать работу с компьютером от просто развлечений."],"hands":["Дайте инструменты и простой проект: скворечник, полка, модель, ремонт велосипеда.","Показывайте мастеров за работой: мастерские, экскурсии на производство."],"nature":["Больше времени вне дома: походы, экскурсии, огород, сезонные наблюдения.","Участвуйте в экологических акциях и ухаживайте за зелёным уголком."],"animals":["Если возможно, заведите питомца и распределите уход; можно помогать приюту.","Читайте о повадках животных и посещайте зоопарк, ферму, ветеринарную клинику."],"research":["Учите задавать вопрос и проверять догадку: гипотеза, опыт, вывод.","Участвуйте в школьных научных проектах и конкурсах."],"business":["Попробуйте мини-проект: продать поделки, организовать школьную ярмарку.","Обсудите, кто ваш клиент, что ему нужно и во что обойдётся."],"order":["Составляйте вместе простые алгоритмы и чек-листы для повседневных дел.","Хвалите за точное соблюдение правил в играх и делах."],"travel":["Планируйте поездки вместе: маршрут, бюджет, достопримечательности.","Предложите вести путевой дневник или фотоальбом."]},"note":"Советы общие и носят справочный характер. Если вас беспокоит поведение, обучение или эмоциональное состояние ребёнка, обратитесь к школьному психологу или специалисту."},MIN=8;
const G=[["study","Школьные предметы и интересы"],["quality","Качества и способности"],["pref","Что нравится делать"]];
const TM=Object.fromEntries(T.map(t=>[t.id,t])),vals={};let step=0;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rated=()=>Object.keys(vals).length;
function go(n){step=n;$("#app").innerHTML=[welcome,assess,results][n]();scrollTo(0,0)}
function resetAll(){for(const k in vals)delete vals[k];go(0)}
function foot(){return `<footer>Критерии и профили профессий — экспертные оценки автора проекта. Результат помогает начать разговор о выборе пути и не заменяет консультацию специалиста.</footer>`}
function welcome(){return `<section class="card"><h1>Какая профессия подойдёт ребёнку?</h1><p>Оцените ребёнка по ${T.length} критериям — от школьных предметов до личных качеств. Сайт сравнит оценки с профилями ${P.length} профессий и покажет те, что совпадают лучше всего.</p><p class="mu">Заполнять могут родитель и педагог любого предмета. Оценивайте только то, что вы знаете о ребёнке: пропущенные критерии не влияют на результат в пользу или во вред. Данные никуда не отправляются и не сохраняются: расчёт идёт в вашем браузере.</p><button class="pr" onclick="go(1)">Начать оценку</button></section>${foot()}`}
function row(t){const v=vals[t.id];return `<div class="tr ${v===undefined?"off":""}" id="r-${t.id}"><div class="th"><b>${t.title}</b><span class="v" id="v-${t.id}">${v===undefined?"не оценено":v}</span><button class="x" onclick="clr('${t.id}')" aria-label="Сбросить оценку: ${t.title}">×</button></div><div class="mu s">${t.desc}</div><input type="range" min="0" max="100" step="5" value="${v??50}" aria-label="${t.title}" oninput="setv('${t.id}',this.value)" onpointerup="setv('${t.id}',this.value)"></div>`}
function assess(){return `<div class="bar">Оценено: <b id="cnt">${rated()}</b> из ${T.length}. Нужно минимум ${MIN}.<div class="prog"><i id="pg" style="width:${rated()/T.length*100}%"></i></div></div>`+G.map(([g,ti])=>`<section class="card"><h2>${ti}</h2><p class="mu s">0 — совсем не про ребёнка, 100 — очень про него. Сдвиньте ползунок, чтобы оценить; кнопка × снимает оценку.</p>${T.filter(t=>t.group==g).map(row).join("")}</section>`).join("")+`<div class="row"><button onclick="go(0)">Назад</button><button id="go" class="pr" onclick="go(2)" ${rated()<MIN?"disabled":""}>Показать профессии</button></div>`}
function upd(){$("#cnt").textContent=rated();$("#pg").style.width=rated()/T.length*100+"%";$("#go").disabled=rated()<MIN}
function setv(id,v){vals[id]=+v;$("#r-"+id).classList.remove("off");$("#v-"+id).textContent=v;upd()}
function clr(id){delete vals[id];$("#r-"+id).classList.add("off");$("#v-"+id).textContent="не оценено";upd()}
function calc(p){let s=0,w=0,y=[];for(const [id,t,k] of p.req){const v=vals[id],c=v===undefined?.5:1-Math.abs(v-t)/100;w+=k;s+=k*c;if(v!==undefined)y.push([k*c,id])}y.sort((a,b)=>b[0]-a[0]);return{p,sc:s/w*100,why:y.slice(0,3).map(x=>TM[x[1]].title)}}
const lab=x=>x>=85?"Высокое соответствие":x>=70?"Хорошее соответствие":"Среднее соответствие";
function card({p,sc,why},i){const b=p.req.map(([id,t])=>{const v=vals[id];return `<div class="rq"><span>${TM[id].title}</span><div class="tk"><i style="left:${t}%"></i>${v===undefined?"":`<u style="width:${v}%"></u>`}</div></div>`}).join("");const li=a=>a.map(x=>`<li>${esc(x)}</li>`).join("");return `<details class="card pc"><summary><span class="n">${i+1}</span><span class="ic" aria-hidden="true">${p.ic}</span><span class="nm"><b>${esc(p.name)}</b><small>${esc(p.category)}</small></span><span class="sc"><b>${Math.round(sc)}%</b><small>${lab(sc)}</small></span></summary><div class="hero" aria-hidden="true"><span>${p.ic}</span></div><p style="margin-top:14px">${esc(p.summary)}</p><p class="mu">${esc(p.activity)}</p><p><b>Почему подходит:</b> ${why.join(", ")||"—"}</p><h3>Профиль профессии и ребёнка</h3>${b}<p class="mu s">Зелёная метка — нужный уровень, фиолетовая полоса — оценка ребёнка.</p><h3>Что можно попробовать</h3><ul>${li(p.dev)}</ul><h3>Плюсы профессии</h3><ul>${li(p.pros)}</ul><h3>Что может быть трудным</h3><ul>${li(p.cons)}</ul><h3>Как получить профессию</h3><ul>${li(p.edu)}</ul>${unis(p)}${p.note?`<p class="nt">${esc(p.note)}</p>`:""}</details>`}
function unis(p){let h=`<h3>Вузы Казахстана</h3>`;if(p.col)h+=`<p class="nt">${esc(U.college)}</p>`;
for(const g of p.dirs){const d=U.groups[g];if(!d)continue;h+=`<p><b>${esc(d.title)}</b></p><ol class="un">${d.list.map(([n,c])=>`<li>${esc(n)} <span class="mu">— ${esc(c)}</span></li>`).join("")}</ol><p class="mu s">Источник: ${esc(d.src)}</p>`}
if(!p.dirs.length&&!p.col)h+=`<p class="mu">Для этой профессии нет единого рейтинга вузов: подготовка идёт в профильных учебных заведениях. Уточните требования в приёмной комиссии.</p>`;
return h+`<p class="mu s">${esc(U.local)}</p><p class="mu s">${esc(U.disc)}</p>`}
function advice(R){const li=a=>a.map(x=>`<li>${esc(x)}</li>`).join("");
const hi=Object.entries(vals).filter(([,v])=>v>=70).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);
const gap={};for(const {p} of R)for(const [id,t,k] of p.req){const v=vals[id];if(v!==undefined&&t-v>=20)gap[id]=Math.max(gap[id]||0,(t-v)*k)}
const lo=Object.keys(gap).sort((a,b)=>gap[b]-gap[a]).slice(0,3);
const blk=(ids,ti,sub)=>ids.length?`<h3>${ti}</h3><p class="mu s">${sub}</p>`+ids.map(id=>`<p><b>${esc(TM[id].title)}</b></p><ul>${li(K.tips[id]||[])}</ul>`).join(""):"";
return `<section class="card"><h2>Как поддержать ребёнка</h2>${blk(hi,"Как развивать сильные стороны","Что у ребёнка получается лучше всего по вашей оценке.")}${blk(lo,"Что можно мягко подтянуть","То, что нужно для подходящих профессий, но пока оценено ниже. Это не недостаток, а точка роста.")}<h3>Общие принципы</h3><ul>${li(K.general)}</ul><p class="mu s">${esc(K.note)}</p></section>`}
function results(){const R=P.map(calc).sort((a,b)=>b.sc-a.sc||a.p.name.localeCompare(b.p.name,"ru"));const cn={},R5=[];for(const r of R){if((cn[r.p.category]||0)>=2)continue;cn[r.p.category]=(cn[r.p.category]||0)+1;R5.push(r);if(R5.length==5)break}const R_=R5;return `<section class="card"><h1>Подходящие профессии</h1><p class="mu">Пять лучших совпадений из ${P.length} профессий (не больше двух из одной сферы, чтобы был виден выбор). Нажмите на профессию: увидите плюсы и минусы, а также вузы Казахстана.</p></section>${R_.map(card).join("")}${advice(R_)}<div class="row np"><button onclick="go(1)">Изменить оценки</button><button onclick="print()">Печать или PDF</button><button onclick="resetAll()">Начать заново</button></div>${foot()}`}
go(0);
</script>
</body>
</html>
